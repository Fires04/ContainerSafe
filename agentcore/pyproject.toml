[project]
name = "containersafe-agentcore"
version = "0.1.0"
description = "Shared Docker introspection + archive assembly for the ContainerSafe agent"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["containersafe_agentcore*"]
